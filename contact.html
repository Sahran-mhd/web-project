<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Team Web Project</title>
    <!-- Link to your specific contact page CSS -->
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>

    <!-- Header will go here (Created by Member 2) -->
    <!-- <div id="header"></div> -->

    <main class="contact-container">
        <h2>Contact Us</h2>
        <p>If you have any questions, please fill out the form below.</p>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" rows="5" placeholder="Enter your message" required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <!-- Footer will go here (Created by Member 2) -->
    <!-- <div id="footer"></div> -->

    <!-- Link to your specific contact page JavaScript -->
    <script src="javascript/contact.js"></script>
</body>
</html>
